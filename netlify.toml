[build]
  command = "npm run styles"
  publish = "public"

[build.environment]
  NODE_VERSION = "22"
  AWS_LAMBDA_JS_RUNTIME = "nodejs22.x"

[functions]
  node_bundler = "esbuild"

[functions.api]
  timeout = 26

[[redirects]]
  force = true
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  force = true
  from = "/uploads/*"
  to = "/.netlify/functions/api/uploads/:splat"
  status = 200
